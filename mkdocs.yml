markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/vendor/katex/auto-render.min.js
  - assets/js/katex.js
  - assets/js/mermaid-theme.js
  - assets/js/callouts.js

extra_css:
  - assets/vendor/katex/katex.min.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/network-on-chip
      name: NoC-Lab GitHub
    - icon: fontawesome/solid/graduation-cap
      link: https://network-on-chip.github.io/.github/
      name: Interactive NoC Papers Map

