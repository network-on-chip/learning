site_name: "Network-on-Chip Learning Hub"
site_description: "An open, interactive curriculum bridging Network-on-Chip theory, silicon microarchitecture, and open-source reproducible research."
site_author: "NoC-Lab Community"
site_url: "https://network-on-chip.github.io/learning/"
repo_url: "https://github.com/network-on-chip/learning"
repo_name: "network-on-chip/learning"
edit_uri: "edit/main/docs/"

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

hooks:
  - hooks.py

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
