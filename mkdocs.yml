site_name: "Network-on-Chip Learning Hub"
site_description: "An open, interactive curriculum bridging Network-on-Chip theory, silicon microarchitecture, and open-source reproducible research."
site_author: "NoC-Lab Community"
site_url: "https://network-on-chip.github.io/learning/"
repo_url: "https://github.com/network-on-chip/learning"
repo_name: "network-on-chip/learning"
edit_uri: "edit/main/docs/"

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

hooks:
  - hooks.py

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            "Home": "首页"
            "Interactive Lab": "交互式实验"
            "2D Mesh Routing Visualizer": "二维网格路由仿真"
            "Wire Wizard: Interconnect Physics": "导线向导：物理互连与RC延迟仿真"
            "Deadlock Buster Arcade Game": "死锁大作战游戏"
            "Packet Master: Routing Puzzle": "数据包路由解密挑战"
            "Hotspot Hero: Thermal Defense": "硅温保卫战：热管理游戏"
            "TSV Titan: 3D-NoC & Thermal Stacking": "TSV泰坦：三维片上网络与热堆叠"
            "Chiplet Tycoon: 2.5D/3D Multi-Die": "芯粒大亨：先进封装设计挑战"
            "Arbiter Arena: Crossbar Clash": "仲裁竞技场：交叉开关调度挑战"
            "Topology Titans: Graph Architect": "拓扑巨人：超算图互连架构师"
            "Photon Pilot: Optical NoC Grid": "光子领航员：光互连网络"
            "Credit Commander: Flow Control": "信用指挥官：流控与反压防御"
            "Deflection Duel: Bufferless NoC": "偏斜决斗：无缓存网络对决"
            "Fault Defender: Silicon Resilience": "故障防御者：硅片韧性与BIST自测"
            "QoS Gladiator: Traffic Arbiter": "服务质量角斗士：混合关键级流量调度"
            "Volt Vortex: Dark Silicon Power": "电压旋涡：暗硅与动态电源门控"
            "Wireless Wave: mmWave & THz NoC": "无线电波：毫米波与太赫兹片上无线网"
            "Neuromorphic Nexus: SNN Spikes": "类脑联结：脉冲神经网络片上互连"
            "Certification & Quiz": "认证考核与答题"
            "Public Leaderboard": "荣誉排行榜"
            "Architecture Glossary": "专业术语词典"
            "Track 1: Interconnect Fundamentals": "第一模块：片上网络基础"
            "Track 2: Router Microarchitecture": "第二模块：路由器微架构"
            "Track 3: Topologies & Metrics": "第三模块：拓扑结构与互连指标"
            "Track 4: Routing & Deadlock": "第四模块：路由算法与死锁避免"
            "Track 5: Thermal & Congestion": "第五模块：热管理与拥塞控制"
            "Track 6: Chiplets & 3D NoC": "第六模块：芯粒与三维片上网络"
            "Track 7: Landmark Papers": "第七模块：经典论文精读"
            "Overview": "总览"
            "Official Textbook (10 Chapters)": "官方开源教材 (全十章)"
            "Part I: Foundations & Microarchitecture": "第一部分：互连基础与微架构"
            "Part II: Topologies & Deadlock Freedom": "第二部分：拓扑结构与无死锁路由"
